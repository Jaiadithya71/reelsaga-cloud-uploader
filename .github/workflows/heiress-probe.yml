name: ReelSaga private Heiress diagnostic
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Private diagnostic variant only
        required: true
        default: "short12"
        type: choice
        options: ["short12", "branded34", "combined12", "covered34", "gameui34"]
permissions:
  contents: write
concurrency:
  group: reelsaga-canary
  cancel-in-progress: false
jobs:
  private-part:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.5
      - run: python -m unittest discover -s tests -v
      - name: One private episode part then verified stop
        env:
          REELSAGA_GOOGLE_CREDENTIALS: ${{ secrets.REELSAGA_GOOGLE_CREDENTIALS }}
          REELSAGA_VARIANT: ${{ inputs.variant }}
          GH_TOKEN: ${{ github.token }}
        run: python actions_heiress_probe.py
