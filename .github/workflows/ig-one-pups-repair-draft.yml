name: ReelSaga ONE approved Pups E1P1 full-height repair draft
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: reelsaga-canary
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install cryptography==46.0.5 cloudinary==1.44.1
    - name: Re-render exact approved original without quality change
      run: "set -euo pipefail\npython - <<'PY'\nimport hashlib,urllib.request,subprocess,zipfile,io,os\n\
        from pathlib import Path\nZIP_URL='https://cps-distr.ikyuedu.com/distribution/8/DramaBox%E8%B5%84%E6%BA%90%E5%8C%85-42000030954-99f818b242e81197601f9da79de29cbc.zip'\n\
        _z=urllib.request.urlopen(ZIP_URL,timeout=600).read()\nif len(_z)!=544812905:raise\
        \ RuntimeError('ZIP size mismatch')\nsource=zipfile.ZipFile(io.BytesIO(_z)).read('Episode1.mp4')\n\
        del _z\nif len(source)!=114622507 or hashlib.sha256(source).hexdigest()!='f6b04898a60d13199f63b13b2f3e5dd56f6f17afe67dd35d2e9a8c1e9c182723':raise\
        \ RuntimeError('Source mismatch')\nPath('source.mp4').write_bytes(source)\n\
        del source\ncmd=(\"apt-get update -qq && apt-get install -y -qq ffmpeg >/dev/null\
        \ && \"\n \"ffmpeg -v error -cpuflags 0 -filter_threads 1 -ss 0 -i source.mp4\
        \ -t 55.397 \"\n \"-vf 'fade=t=in:st=0:d=0.5,fade=t=out:st=54.897:d=0.5' \"\
        \n \"-af 'afade=t=in:st=0:d=0.5,afade=t=out:st=54.897:d=0.5' \"\n \"-c:v libx264\
        \ -threads:v 3 -x264-params asm=0 -preset ultrafast -crf 18 \"\n \"-c:a aac\
        \ -flags:a +bitexact -b:a 192k -movflags +faststart -y p1.mp4 \"\n \"&& ffmpeg\
        \ -v error -i p1.mp4 -f null -\")\nsubprocess.run(['docker','run','--rm','--cpuset-cpus',','.join(map(str,sorted(os.sched_getaffinity(0))[:2])),'-v',str(Path.cwd())+':/work','-w','/work','ubuntu:22.04','bash','-c',cmd],check=True)\n\
        rb=Path('p1.mp4').read_bytes()\nhs=hashlib.sha256(rb).hexdigest()\nprint('EP1P1_BYTES\
        \ '+str(len(rb)),flush=True)\nprint('EP1P1_SHA256 '+hs,flush=True)\nif hs!='35f6af5adeed92f6f5376bb489f690797baf96038b4eb082be9b8157d646b5fc':\n\
        \    raise SystemExit('Re-render mismatch - NOT byte-identical, stop')\nPY\n"
    - name: ONE authenticated original and private draft only
      env:
        GH_TOKEN: ${{ github.token }}
        REELSAGA_LEDGER_KEY: ${{ secrets.REELSAGA_LEDGER_KEY }}
        REELSAGA_CLOUDINARY_API_SECRET: ${{ secrets.REELSAGA_CLOUDINARY_API_SECRET
          }}
        REELSAGA_BUFFER_API_KEY: ${{ secrets.REELSAGA_BUFFER_API_KEY }}
      run: 'set +x

        PYTHONPATH=. python ig-one-repair/run.py'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: one-pups-repair-draft-readback
        path: 'receipt.json

          private-readback.enc'
        retention-days: 1
    - name: Delete local original
      if: always()
      run: rm -f p1.mp4 source.mp4
