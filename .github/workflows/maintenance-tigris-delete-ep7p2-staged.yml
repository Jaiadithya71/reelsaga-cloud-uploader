name: maintenance-tigris-delete-ep7p2-staged
on:
  workflow_dispatch: {}
concurrency:
  group: reelsaga-canary
  cancel-in-progress: false
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3
      - name: Delete the orphaned SM EP7P2 staged object after audited reconcile
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
        run: |
          cat > del.py <<'PYEOF'
          import boto3, os
          from botocore.config import Config
          B='reelsaga-private-staging-71'
          KEY='production/netshort-suprememage-ep7-part2-v1/video.mp4'
          EXPECT_SHA='700de946ba776b60405f07b4e097b480ab6f402a83157e94f77ef2339d99fc90'
          s3=boto3.client('s3', endpoint_url='https://t3.storage.dev', region_name='auto',
              aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],
              config=Config(signature_version='s3v4', retries={'total_max_attempts':3}, s3={'addressing_style':'path'}))
          try:
              head=s3.head_object(Bucket=B, Key=KEY)
          except s3.exceptions.ClientError as e:
              if e.response['Error']['Code'] in ('404','NoSuchKey','NotFound'):
                  print('AUDIT absent already; nothing to delete', flush=True)
                  raise SystemExit(0)
              raise
          print('AUDIT', KEY, 'bytes', head['ContentLength'], 'sha', head.get('Metadata',{}).get('sha256'), flush=True)
          if head['ContentLength']!=63581652 or head.get('Metadata',{}).get('sha256')!=EXPECT_SHA:
              raise SystemExit('REFUSE: staged object does not match the audited EP7P2 render values')
          s3.delete_object(Bucket=B, Key=KEY)
          try:
              s3.head_object(Bucket=B, Key=KEY)
              print('DELETE_FAIL still present', flush=True)
              raise SystemExit(1)
          except s3.exceptions.ClientError as e:
              if e.response['Error']['Code'] in ('404','NoSuchKey','NotFound'):
                  print('DELETE_OK', KEY, flush=True)
              else:
                  raise
          PYEOF
          python del.py
