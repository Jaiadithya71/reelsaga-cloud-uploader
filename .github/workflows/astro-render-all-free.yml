name: Astronaut all-free full-coverage renders only
'on':
  workflow_dispatch:
    inputs:
      sources_json:
        required: true
        type: string
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
    - name: Render all free originals without publishing
      env:
        SOURCES_JSON: ${{ inputs.sources_json }}
      run: 'set +x

        python astro_render_all.py'
    - uses: actions/upload-artifact@v4
      with:
        name: astro-full-free-renders
        path: 'astro/

          astro-render-receipt.json'
        retention-days: 1
