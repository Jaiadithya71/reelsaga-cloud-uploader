name: Weakest Null IG upload read-only reconciliation
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: reelsaga-canary
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: 'python -m pip install cryptography==46.0.5 boto3==1.40.61 numpy==2.3.4
        pillow==12.0.0

        sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null

        python -m pip install requests'
    - name: Next own-part-reviewed original with complete live gates
      env:
        GH_TOKEN: ${{ github.token }}
        REELSAGA_LEDGER_KEY: ${{ secrets.REELSAGA_LEDGER_KEY }}
        REELSAGA_BUFFER_API_KEY: ${{ secrets.REELSAGA_BUFFER_API_KEY }}
        AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
      run: 'set +x

        PYTHONPATH=.:ig-recovery python null_ig_upload_reconcile.py'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ig-upload-reconcile
        path: ig-upload-reconcile.json
        retention-days: 2
