name: ReelSaga public-release spacing preflight (cross-lane 1h guard)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: reelsaga-canary
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install cryptography==46.0.5 requests
    - name: Cross-lane 1-hour public spacing preflight
      env:
        REELSAGA_GOOGLE_CREDENTIALS: ${{ secrets.REELSAGA_GOOGLE_CREDENTIALS }}
        REELSAGA_IG_READ_KEY: ${{ secrets.REELSAGA_IG_READ_KEY }}
        REELSAGA_BUFFER_API_KEY: ${{ secrets.REELSAGA_BUFFER_API_KEY }}
        REELSAGA_IG_READER_URL: https://kathirvelan-boutique.vercel.app/api/instagram/reelsaga-reader
      run: python release_preflight.py
