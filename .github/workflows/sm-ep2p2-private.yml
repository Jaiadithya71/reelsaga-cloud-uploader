concurrency:
  cancel-in-progress: false
  group: reelsaga-canary
jobs:
  private-part:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: '/*.py

          /tests/

          /**/*.json

          '
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install cryptography==46.0.5 boto3
    - name: SupremeMage EP2P2 private only
      env:
        GH_TOKEN: ${{ github.token }}
        REELSAGA_LEDGER_KEY: ${{ secrets.REELSAGA_LEDGER_KEY }}
        REELSAGA_IG_READ_KEY: ${{ secrets.REELSAGA_IG_READ_KEY }}
        REELSAGA_GOOGLE_CREDENTIALS: ${{ secrets.REELSAGA_GOOGLE_CREDENTIALS }}
        AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
        TIGRIS_BUCKET: reelsaga-private-staging-71
      run: "cat > quarantine_state.py <<'QUARANTINE_FILE'\n\"\"\"Fail-closed new namespace. Original legacy records are never\
        \ mutated.\"\"\"\nimport hashlib,json,re\nfrom github_state import GitHubState,StateError\nfrom adapters import checked\n\
        FROZEN='7cf655bd667d748e2e4030da1b6b78c7aa0c236e'\nclass QuarantineState(GitHubState):\n    def __init__(self,request,key_material):\n\
        \        super().__init__(request,key_material)\n        with open('legacy_quarantine.json') as f:self.inventory=json.load(f)\n\
        \        if self.inventory['frozen_commit']!=FROZEN or len(self.inventory['legacy_keys'])!=279:\n            raise\
        \ StateError('Legacy inventory mismatch')\n        self.legacy=set(self.inventory['legacy_keys'])\n    def initialize(self):\n\
        \        r=checked(self.request('GET',self.base+'/git/trees/'+FROZEN,params={'recursive':'1'})).data\n        if r.get('truncated')\
        \ is not False:raise StateError('Incomplete legacy tree')\n        keys={v['path'][6:-4] for v in r['tree'] if v['path'].startswith('state/')\
        \ and v['path'].endswith('.enc')}\n        if keys!=self.legacy:raise StateError('Legacy inventory integrity mismatch')\n\
        \        r=self.request('GET',self.base+'/git/ref/heads/'+self.branch)\n        if r.status!=200:raise StateError('Original\
        \ state branch missing')\n    def url(self,key):\n        if not re.fullmatch(r'[a-zA-Z0-9_-]+',key):raise StateError('Invalid\
        \ state key')\n        return self.base+'/contents/state-v2/'+key+'.enc'\n    def blocked(self,key):\n        if not\
        \ re.fullmatch(r'[0-9a-f]{64}',key):return False\n        if key in self.legacy:return True\n        r=self.request('GET',self.base+'/contents/state/'+key+'.enc',params={'ref':self.branch})\n\
        \        if r.status==200:return True\n        if r.status!=404:raise StateError('Legacy read not verified')\n   \
        \     return False\n    def get(self,key):\n        if self.blocked(key):return {'state':'blocked','legacy_quarantine':True},None\n\
        \        return super().get(key)\n    def compare_and_swap(self,key,version,record):\n        if self.blocked(key):raise\
        \ StateError('Legacy key permanently quarantined')\n        return super().compare_and_swap(key,version,record)\n\
