name: Soldier EP3P1 IG staging (encrypted render artifact)
on:
  workflow_dispatch:
    inputs:
      gpg_pub:
        description: armored one-time public key
        required: true
permissions:
  actions: read
concurrency:
  group: reelsaga-canary
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
    - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
    - name: Re-render EP3P1 (repaired), verify pinned shas, encrypt
      env:
        PUB: ${{ inputs.gpg_pub }}
      run: |
        set -euo pipefail
        python - <<'PY'
        import hashlib,subprocess,requests,io,zipfile
        from pathlib import Path
        u='https://cps-distr.ikyuedu.com/distribution/11/DramaBox%E8%B5%84%E6%BA%90%E5%8C%85-42000030015-a2271090e1a760ac5345d014ae9a7fbd.zip'
        s=requests.Session();response=s.head(u,timeout=30);response.raise_for_status();size=int(response.headers['Content-Length'])
        class Remote(io.RawIOBase):
         def __init__(self):self.pos=0
         def seekable(self):return True
         def readable(self):return True
         def tell(self):return self.pos
         def seek(self,o,w=0):self.pos=o if w==0 else self.pos+o if w==1 else size+o;return self.pos
         def read(self,n=-1):
          if n<0:n=size-self.pos
          if not n:return b''
          r=s.get(u,headers={'Range':f'bytes={self.pos}-{min(size-1,self.pos+n-1)}'},timeout=40);r.raise_for_status();assert r.status_code==206;self.pos+=len(r.content);return r.content
        z=zipfile.ZipFile(Remote());assert 'Episode3.mp4' in z.namelist();Path('source.mp4').write_bytes(z.read('Episode3.mp4'))
        assert hashlib.sha256(Path('source.mp4').read_bytes()).hexdigest()=='96558385f514e6242fb22f68e67cbd8d5c93e05ff2f528a432494e4727b9ab1e','Source episode differs'
        subprocess.run(['ffmpeg','-v','error','-i','source.mp4','-f','null','-'],check=True)
        subprocess.run(['ffmpeg','-v','error','-filter_threads','1','-ss','0','-i','source.mp4','-t','42.5','-vf','fade=t=in:st=0:d=0.5,fade=t=out:st=42.0:d=0.5','-af','afade=t=in:st=0:d=0.5,afade=t=out:st=42.0:d=0.5','-c:v','libx264','-threads:v','2','-preset','ultrafast','-crf','18','-c:a','aac','-b:a','192k','-movflags','+faststart','-y','p1base.mp4'],check=True)
        base=Path('p1base.mp4').read_bytes()
        if len(base)!=49696204 or hashlib.sha256(base).hexdigest()!='46158ac397a40080988e5af0d5c9c72cb5c27132da751ffdeb22ad01ef9baf0d':raise RuntimeError('Base render differs from catalog pinned part; fail closed')
        # Subtitle defect repair under user authority 2026-11-05 14:16 (WhatsApp "Rectify the defects and make sure those don't happen again"): caption boundary fix at 33.0-34.4s. Footage and original audio preserved.
        Path('line-0.txt').write_text("just two weeks after surgery.")
        subprocess.run(['ffmpeg','-v','error','-threads','2','-i','p1base.mp4','-vf',"drawbox=x=200:y=1360:w=680:h=100:color=black:t=fill:enable='between(t,33.0,34.4)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:textfile=line-0.txt:fontcolor=white:fontsize=46:borderw=2:bordercolor=black:line_spacing=9:x=(w-text_w)/2:y=1372:enable='between(t,33.0,34.4)'",'-c:v','libx264','-threads:v','2','-preset','ultrafast','-crf','18','-c:a','copy','-movflags','+faststart','-y','p1.mp4'],check=True)
        subprocess.run(['ffmpeg','-v','error','-i','p1.mp4','-f','null','-'],check=True)
        _a1=hashlib.sha256(subprocess.check_output(['ffmpeg','-v','error','-i','p1base.mp4','-map','0:a:0','-c','copy','-f','adts','-'])).hexdigest()
        _a2=hashlib.sha256(subprocess.check_output(['ffmpeg','-v','error','-i','p1.mp4','-map','0:a:0','-c','copy','-f','adts','-'])).hexdigest()
        if _a1!=_a2 or _a2!='e170b08be18972a09706b43299088137d8c0992c8e8e7b7fbaa07d6a27a604b0':raise RuntimeError('Audio stream changed by repair; fail closed')
        rb=Path('p1.mp4').read_bytes();hs=hashlib.sha256(rb).hexdigest()
        print('EP3P1_BYTES '+str(len(rb)),flush=True);print('EP3P1_SHA256 '+hs,flush=True)
        if len(rb)!=47473972 or hs!='ffc5cc796bb60ac43a81fa9439946aa9acbd5da877afec1264a32919d0c6e4d1':raise SystemExit('Re-render mismatch - NOT byte-identical to probe-pinned part, stop')
        PY
        printf '%s
        ' "$PUB" | gpg --batch --import
        gpg --batch --yes --trust-model always --compress-level 0 --encrypt --recipient rs-xfer-onetime --output p1.mp4.gpg p1.mp4
        sync
        sudo shred -u p1.mp4 p1base.mp4 source.mp4 line-0.txt 2>/dev/null || sudo rm -f p1.mp4 p1base.mp4 source.mp4 line-0.txt
        ls -la p1.mp4.gpg
    - name: upload encrypted artifact
      uses: actions/upload-artifact@v4
      with:
        name: soldier-e3p1-ig
        path: p1.mp4.gpg
        retention-days: 1
