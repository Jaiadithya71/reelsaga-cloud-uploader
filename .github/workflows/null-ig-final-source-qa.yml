name: Weakest Null final free episodes source QA only
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
    - run: python -m pip install requests
    - run: python null_ig_final_source_qa.py
    - uses: actions/upload-artifact@v4
      with:
        name: final-source-qa
        path: final-source-qa
        retention-days: 2
