name: Golden full free-run original-quality render QA only
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: 'sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null

        python -m pip install requests

        python golden_all_renderqa.py'
    - uses: actions/upload-artifact@v4
      with:
        name: golden-all-renderqa
        path: golden-renderqa/
        retention-days: 1
