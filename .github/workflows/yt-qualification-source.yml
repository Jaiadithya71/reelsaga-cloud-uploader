name: ReelSaga read-only source qualification
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
    - run: python yt-qualification/source-check.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: source-qualification
        path: |
          qualification/probe.json
          qualification/frame-*.jpg
        retention-days: 2
