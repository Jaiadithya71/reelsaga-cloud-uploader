name: Weakest Null failed private probe read-only reconciliation
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: reelsaga-canary
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install cryptography==46.0.5 requests
    - env:
        GH_TOKEN: ${{ github.token }}
        REELSAGA_LEDGER_KEY: ${{ secrets.REELSAGA_LEDGER_KEY }}
        REELSAGA_GOOGLE_CREDENTIALS: ${{ secrets.REELSAGA_GOOGLE_CREDENTIALS }}
      run: 'set +x

        python null_private_reconcile.py'
