name: ReelSaga queue preflight
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: reelsaga-queue
  cancel-in-progress: false
jobs:
  preflight:
    if: vars.REELSAGA_PREFLIGHT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python preflight.py
