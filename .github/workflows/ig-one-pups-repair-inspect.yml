name: ReelSaga read-only existing Pups repair reconciliation
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: reelsaga-canary
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install cryptography==46.0.5 cloudinary==1.44.1
    - name: Read-only post state and mutation schema
      env:
        REELSAGA_BUFFER_API_KEY: ${{ secrets.REELSAGA_BUFFER_API_KEY }}
      run: 'set +x

        python ig-one-repair/inspect.py'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: one-pups-inspect-receipt
        path: inspect-receipt.json
        retention-days: 1
