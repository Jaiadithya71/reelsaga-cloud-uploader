name: ReelSaga one-time state and stop probe
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reelsaga-canary
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
            /tests/
            /**/*.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.5
      - name: Core and private-upload safety tests
        run: |
          for test in tests/test_*.py; do
            case $test in
              tests/test_actions_real_part.py|tests/test_actions_vows_part.py|tests/test_actions_heiress_part.py) continue ;;
            esac
            python -m unittest discover -s tests -p $(basename $test) -v || exit 1
          done
      - name: Check encrypted durable state and stopped controls, no video upload
        env:
          REELSAGA_GOOGLE_CREDENTIALS: ${{ secrets.REELSAGA_GOOGLE_CREDENTIALS }}
          GH_TOKEN: ${{ github.token }}
        run: python actions_state_probe.py
