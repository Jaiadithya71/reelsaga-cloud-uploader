name: ReelSaga one-time state and stop probe
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reelsaga-canary
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.5
      - run: python -m unittest discover -s tests -v
      - name: Check encrypted durable state and stopped controls, no video upload
        env:
          REELSAGA_GOOGLE_CREDENTIALS: ${{ secrets.REELSAGA_GOOGLE_CREDENTIALS }}
          STATE_DIAGNOSTIC_ONLY: 'true'
          GH_TOKEN: ${{ github.token }}
        run: python actions_state_probe.py
