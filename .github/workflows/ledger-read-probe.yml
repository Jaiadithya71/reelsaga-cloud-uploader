name: ReelSaga ledger read probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reelsaga-canary
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: '/*.py'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install cryptography==46.0.5
    - name: Read durable ledger claims for SM EP5P2
      env:
        GH_TOKEN: ${{ github.token }}
        REELSAGA_LEDGER_KEY: ${{ secrets.REELSAGA_LEDGER_KEY }}
      run: |
        python - <<'PY'
        import os,json
        from quarantine_state import QuarantineState
        from durable_state import DurableLedger
        from transport import Transport
        gh=os.environ.pop('GH_TOKEN','');key=os.environ.pop('REELSAGA_LEDGER_KEY','')
        backend=QuarantineState(Transport(lambda:gh,{'api.github.com'}),key);backend.initialize()
        ledger=DurableLedger(backend)
        for pid in ['netshort-suprememage-ep5-part2-v2','netshort-suprememage-ep5-part2-v3']:
            for plat in ['instagram','youtube']:
                rec,_=backend.get(ledger.key(pid,plat))
                if rec:
                    out={'state':rec.get('state'),'has_session':bool(rec.get('session')),'has_external_id':bool(rec.get('external_id'))}
                    if plat=='youtube' and rec.get('external_id'):out['external_id']=rec['external_id']
                    if plat=='instagram' and rec.get('external_id'):out['ig_container']=rec['external_id']
                    print(pid,plat,json.dumps(out),flush=True)
                else:
                    print(pid,plat,'NO_CLAIM',flush=True)
        PY
