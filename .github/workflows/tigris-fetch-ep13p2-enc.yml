name: Tigris fetch EP13P2 (encrypted artifact)
on:
  workflow_dispatch:
    inputs:
      gpg_pub:
        description: armored one-time public key
        required: true
      artifact_name:
        description: artifact name
        required: true
permissions:
  actions: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: fetch, verify sha256, encrypt to one-time key
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          PUB: ${{ inputs.gpg_pub }}
        run: |
          set -euo pipefail
          aws s3 cp --endpoint-url https://t3.storage.dev s3://reelsaga-private-staging-71/production/playlet-ambassador-ep13-part2-v1/video.mp4 /tmp/x.bin
          echo "77f6f8502d95900645f861c9d3e7d2c40c4a27ea51ca55f4d6e2f27f4df81ff6  /tmp/x.bin" | sha256sum -c -
          printf '%s\n' "$PUB" | gpg --batch --import
          gpg --batch --yes --trust-model always --compress-level 0 --encrypt --recipient rs-xfer-onetime --output /tmp/x.bin.gpg /tmp/x.bin
          shred -u /tmp/x.bin
          mv /tmp/x.bin.gpg payload.bin.gpg
      - name: upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: payload.bin.gpg
          retention-days: 1
