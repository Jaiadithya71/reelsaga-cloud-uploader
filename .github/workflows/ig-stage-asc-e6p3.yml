name: ASC E6P3 IG staging (encrypted render artifact)
on:
  workflow_dispatch:
    inputs:
      gpg_pub:
        description: armored one-time public key
        required: true
permissions:
  actions: read
concurrency:
  group: reelsaga-canary
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: Re-render E6P3, verify original sha, encrypt
      env:
        PUB: ${{ inputs.gpg_pub }}
      run: |
        set -euo pipefail
        python - <<'PY'
        import hashlib,urllib.request,urllib.parse,subprocess,zipfile,io,os
        from pathlib import Path
        ZIP_URL='https://cps-distr.ikyuedu.com/distribution/8/'+urllib.parse.quote('DramaBox资源包-42000030937-8711bb07bc0f52a4b5705d40a406d794.zip')
        _z=urllib.request.urlopen(ZIP_URL,timeout=600).read()
        if len(_z)!=781820223:raise RuntimeError('ZIP size mismatch')
        source=zipfile.ZipFile(io.BytesIO(_z)).read('Episode6.mp4')
        del _z
        if len(source)!=81296532 or hashlib.sha256(source).hexdigest()!='8b7990a2d99c0350728e0e65c90dc362b31be9dc44ca0a9d0264e1c6d1aa1287':raise RuntimeError('Source mismatch')
        Path('source.mp4').write_bytes(source)
        del source
        cmd=("apt-get update -qq && apt-get install -y -qq ffmpeg >/dev/null && "
         "ffmpeg -v error -cpuflags 0 -filter_threads 1 -ss 80.0 -i source.mp4 -t 39.979 "
         "-vf 'fade=t=in:st=0:d=0.5,fade=t=out:st=39.479:d=0.5' "
         "-af 'afade=t=in:st=0:d=0.5,afade=t=out:st=39.479:d=0.5' "
         "-c:v libx264 -threads:v 3 -x264-params asm=0 -preset ultrafast -crf 18 "
         "-c:a aac -flags:a +bitexact -b:a 192k -movflags +faststart -y p3.mp4 "
         "&& ffmpeg -v error -i p3.mp4 -f null -")
        subprocess.run(['docker','run','--rm','--cpuset-cpus',','.join(map(str,sorted(os.sched_getaffinity(0))[:2])),'-v',str(Path.cwd())+':/work','-w','/work','ubuntu:22.04','bash','-c',cmd],check=True)
        rb=Path('p3.mp4').read_bytes()
        hs=hashlib.sha256(rb).hexdigest()
        print('E6P3_BYTES '+str(len(rb)),flush=True)
        print('E6P3_SHA256 '+hs,flush=True)
        if hs!='132a2f9d1672d88e661666458c1445f292debbcf89d0882e08d8706ef9c42efd':
            raise SystemExit('Re-render mismatch - NOT byte-identical, stop')
        PY
        printf '%s
        ' "$PUB" | gpg --batch --import
        gpg --batch --yes --trust-model always --compress-level 0 --encrypt --recipient rs-xfer-onetime --output p3.mp4.gpg p3.mp4
        sync
        sudo shred -u p3.mp4 source.mp4 2>/dev/null || sudo rm -f p3.mp4 source.mp4
        ls -la p3.mp4.gpg
    - name: upload encrypted artifact
      uses: actions/upload-artifact@v4
      with:
        name: asc-e6p3-ig
        path: p3.mp4.gpg
        retention-days: 1
