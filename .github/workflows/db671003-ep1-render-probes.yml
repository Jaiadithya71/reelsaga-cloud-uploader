name: ReelSaga DramaBox 671003 EP1 render probes (private research prep, no publish)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reelsaga-canary
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: Probe 671003 ep1 renders
      run: |
        python - <<'PY'
        import hashlib,urllib.request,urllib.parse,subprocess,os,zipfile,io
        from pathlib import Path
        ZIP_URL='https://cps-distr.ikyuedu.com/distribution/8/'+urllib.parse.quote('DramaBox资源包-42000030937-8711bb07bc0f52a4b5705d40a406d794.zip')
        data=urllib.request.urlopen(ZIP_URL,timeout=600).read()
        if len(data)!=781820223:raise SystemExit('ZIP size mismatch')
        z=zipfile.ZipFile(io.BytesIO(data))
        ep1=z.read('Episode1.mp4')
        del data
        if len(ep1)!=139502601 or hashlib.sha256(ep1).hexdigest()!='11f150e54604e65f3cf7972ce852ad299ef3384339be9ba9d3a513918ec5d43b':raise SystemExit('Episode1 mismatch')
        print('EP1_SOURCE_BYTES',len(ep1),flush=True)
        print('EP1_SOURCE_SHA256',hashlib.sha256(ep1).hexdigest(),flush=True)
        Path('source.mp4').write_bytes(ep1)
        del ep1
        PARTS=[(1,'0','50.529'),(2,'50.529','50.529'),(3,'101.058','50.529'),(4,'151.587','50.529')]
        renders=[]
        for part,ss,t in PARTS:
            fd=str(round(float(t)-0.5,3))
            renders.append((part,'ffmpeg -v error -cpuflags 0 -filter_threads 1 -ss '+ss+' -i source.mp4 -t '+t+' -vf \'fade=t=in:st=0:d=0.5,fade=t=out:st='+fd+':d=0.5\' -af \'afade=t=in:st=0:d=0.5,afade=t=out:st='+fd+':d=0.5\' -c:v libx264 -threads:v 3 -x264-params asm=0 -preset ultrafast -crf 18 -c:a aac -flags:a +bitexact -b:a 192k -movflags +faststart -y p'+str(part)+'.mp4 && ffmpeg -v error -i p'+str(part)+'.mp4 -f null -'))
        cmd='apt-get update -qq && apt-get install -y -qq ffmpeg >/dev/null && '+' && '.join(r[1] for r in renders)
        subprocess.run(['docker','run','--rm','--cpuset-cpus',','.join(map(str,sorted(os.sched_getaffinity(0))[:2])),'-v',os.getcwd()+':/work','-w','/work','ubuntu:22.04','bash','-c',cmd],check=True)
        for part,ss,t in PARTS:
            rb=Path('p'+str(part)+'.mp4').read_bytes()
            print('DB671003E1P'+str(part)+'_RENDER_BYTES '+str(len(rb)),flush=True)
            print('DB671003E1P'+str(part)+'_RENDER_SHA256 '+hashlib.sha256(rb).hexdigest(),flush=True)
        PY
