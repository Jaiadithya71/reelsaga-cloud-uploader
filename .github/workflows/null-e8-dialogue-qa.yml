name: Weakest Null E8 dialogue boundary audit
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
    - run: python -m pip install requests
    - run: python null_e8_dialogue_qa.py
    - uses: actions/upload-artifact@v4
      with:
        name: null-dialogue-qa
        path: null-dialogue-qa
