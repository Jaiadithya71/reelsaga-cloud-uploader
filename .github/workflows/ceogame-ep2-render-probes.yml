name: ReelSaga CEOGame EP2 render probes
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reelsaga-canary
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: Probe ceogame ep2 renders
      run: |
        python - <<'PY'
        import hashlib,urllib.request,subprocess,os
        from pathlib import Path
        SOURCE_URL='https://cdn-aws2.playlet.com/mp4/v2/10640/2/2_d17d70aa7b56f75df832731bf11a66cd.mp4'
        data=urllib.request.urlopen(SOURCE_URL,timeout=120).read()
        if len(data)!=7942843 or hashlib.sha256(data).hexdigest()!='32cbcb7bf5bba6fc3aefe9d4a2595371e84d7300d8c8d6bb84c1cceb36f00717':raise SystemExit('Source mismatch')
        Path('source.mp4').write_bytes(data)
        PARTS=[(1,'0','50'),(2,'50','50'),(3,'100','17.779')]
        renders=[]
        for part,ss,t in PARTS:
            fd=str(round(float(t)-0.5,3))
            renders.append((part,'ffmpeg -v error -cpuflags 0 -filter_threads 1 -ss '+ss+' -i source.mp4 -t '+t+' -vf \'fade=t=in:st=0:d=0.5,fade=t=out:st='+fd+':d=0.5\' -af \'afade=t=in:st=0:d=0.5,afade=t=out:st='+fd+':d=0.5\' -c:v libx264 -threads:v 3 -x264-params asm=0 -preset ultrafast -crf 18 -c:a aac -flags:a +bitexact -b:a 192k -movflags +faststart -y p'+str(part)+'.mp4 && ffmpeg -v error -i p'+str(part)+'.mp4 -f null -'))
        cmd='apt-get update -qq && apt-get install -y -qq ffmpeg >/dev/null && '+' && '.join(r[1] for r in renders)
        subprocess.run(['docker','run','--rm','--cpuset-cpus',','.join(map(str,sorted(os.sched_getaffinity(0))[:2])),'-v',os.getcwd()+':/work','-w','/work','ubuntu:22.04','bash','-c',cmd],check=True)
        for part,ss,t in PARTS:
            rb=Path('p'+str(part)+'.mp4').read_bytes()
            print('CEOGAME_EP2P'+str(part)+'_RENDER_BYTES '+str(len(rb)),flush=True)
            print('CEOGAME_EP2P'+str(part)+'_RENDER_SHA256 '+hashlib.sha256(rb).hexdigest(),flush=True)
        PY
