name: Tigris fetch part (encrypted artifact, parameterized)
on:
  workflow_dispatch:
    inputs:
      s3_key:
        description: object key under reelsaga-private-staging-71
        required: true
      expected_sha:
        description: sha256 of the object
        required: true
      gpg_pub:
        description: armored one-time public key
        required: true
      artifact_name:
        description: artifact name
        required: true
permissions:
  actions: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: fetch, verify sha256, encrypt to one-time key
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          PUB: ${{ inputs.gpg_pub }}
          S3KEY: ${{ inputs.s3_key }}
          SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          case "$S3KEY" in
            production/playlet-ambassador-ep11-part1-v1/video.mp4|production/playlet-ambassador-ep11-part2-v1/video.mp4|production/playlet-ambassador-ep12-part1-v1/video.mp4|production/playlet-ambassador-ep12-part2-v1/video.mp4|production/playlet-ambassador-ep13-part1-v1/video.mp4|production/playlet-ambassador-ep13-part2-v1/video.mp4) ;;
            *) echo "key not on allowlist"; exit 1;;
          esac
          aws s3 cp --endpoint-url https://t3.storage.dev "s3://reelsaga-private-staging-71/$S3KEY" /tmp/x.bin
          echo "$SHA  /tmp/x.bin" | sha256sum -c -
          printf '%s\n' "$PUB" | gpg --batch --import
          gpg --batch --yes --trust-model always --compress-level 0 --encrypt --recipient rs-xfer-onetime --output /tmp/x.bin.gpg /tmp/x.bin
          shred -u /tmp/x.bin
          mv /tmp/x.bin.gpg payload.bin.gpg
      - name: upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: payload.bin.gpg
          retention-days: 1
