name: ReelSaga single private canary
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reelsaga-canary
  cancel-in-progress: false
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.5
      - run: python -m unittest discover -s tests -v
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Generate three-second silent synthetic pattern
        run: ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=360x640:rate=30 -t 3 -an -c:v libx264 -pix_fmt yuv420p -movflags +faststart canary.mp4
      - name: Single private test, saved encrypted checkpoint, stop verification
        env:
          REELSAGA_GOOGLE_CREDENTIALS: ${{ secrets.REELSAGA_GOOGLE_CREDENTIALS }}
          GH_TOKEN: ${{ github.token }}
        run: python actions_canary.py
