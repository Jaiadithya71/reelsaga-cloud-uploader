name: Robot EP4P3 duplicate-read diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
            /tests/
            /**/*.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.5
      - name: Read-only duplicate read diagnostic
        env:
          REELSAGA_GOOGLE_CREDENTIALS: ${{ secrets.REELSAGA_GOOGLE_CREDENTIALS }}
        run: |
          cat > diag_dupread.py <<'DIAG'
          import os,json
          from actions_canary import Store
          from desktop_setup import CHANNEL,SCOPES
          from provision_actions import validated_record
          from credentials import GoogleCredentials
          from transport import Transport,GoogleTokenForms
          record=validated_record(os.environ.pop('REELSAGA_GOOGLE_CREDENTIALS',''))
          credential=GoogleCredentials(Store(record),GoogleTokenForms(),SCOPES)
          token=credential.access_token()
          api=Transport(lambda:token,{'www.googleapis.com'})
          def show(label,r):
              d=r.data if isinstance(r.data,dict) else {}
              err=(d.get('error') or {})
              errs=err.get('errors') or []
              print(json.dumps({'label':label,'status':r.status,'reason':(errs[0].get('reason') if errs else None),'message':str(err.get('message') or '')[:160]}))
          r=api('GET','https://www.googleapis.com/youtube/v3/channels',params={'part':'contentDetails','mine':'true'})
          show('channels.contentDetails',r)
          if r.status==200:
              playlist=r.data['items'][0]['contentDetails']['relatedPlaylists']['uploads']
              print('uploads playlist',playlist)
              page=None;seen=set();ids=[];total=None;totals=[]
              while True:
                  q={'part':'contentDetails','playlistId':playlist,'maxResults':'50'}
                  if page:q['pageToken']=page
                  rr=api('GET','https://www.googleapis.com/youtube/v3/playlistItems',params=q)
                  show('playlistItems page',rr)
                  if rr.status!=200:break
                  data=rr.data
                  totals.append(data['pageInfo']['totalResults'])
                  if total is None:total=data['pageInfo']['totalResults']
                  ids.extend(x['contentDetails']['videoId'] for x in data.get('items',[]))
                  page=data.get('nextPageToken')
                  if not page:break
                  if page in seen:
                      print('PAGINATION LOOP');break
                  seen.add(page)
              print(json.dumps({'totals_per_page':totals,'id_count':len(ids)}))
              ids=list(dict.fromkeys(ids))
              for n in range(0,len(ids),50):
                  batch=ids[n:n+50]
                  rr=api('GET','https://www.googleapis.com/youtube/v3/videos',params={'part':'snippet,status','id':','.join(batch)})
                  show('videos batch %d'%n,rr)
                  if rr.status!=200:break
                  got={v['id'] for v in rr.data.get('items',[])}
                  missing=set(batch)-got
                  if missing:print('MISSING FROM VIDEOS.LIST:',sorted(missing))
                  for video in rr.data.get('items',[]):
                      sn=video['snippet']
                      if sn['channelId']!=CHANNEL:print('CHANNEL MISMATCH',video['id'],sn.get('channelId'))
                      t=sn.get('title','')
                      if 'Episode 4 Part 3' in t:print('DUP MATCH:',video['id'],t)
          print('diag done')
          DIAG
          python diag_dupread.py
