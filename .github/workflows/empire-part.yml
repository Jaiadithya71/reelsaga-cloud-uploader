name: Swarm EP9P1 read-only processing status
permissions:
  contents: write
concurrency:
  group: reelsaga-canary
  cancel-in-progress: false
jobs:
  private-part:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: '/*.py

          /tests/

          /**/*.json

          '
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install cryptography==46.0.5
    - name: Read processing status only
      env:
        GH_TOKEN: ${{ github.token }}
        REELSAGA_LEDGER_KEY: ${{ secrets.REELSAGA_LEDGER_KEY }}
        REELSAGA_IG_READ_KEY: ${{ secrets.REELSAGA_IG_READ_KEY }}
        REELSAGA_GOOGLE_CREDENTIALS: ${{ secrets.REELSAGA_GOOGLE_CREDENTIALS }}
      run: 'cat > status_read.py <<''STATUS''

        import os,json

        from actions_canary import Store

        from provision_actions import validated_record

        from credentials import GoogleCredentials

        from transport import Transport,GoogleTokenForms

        from desktop_setup import SCOPES,CHANNEL

        from adapters import checked

        r=validated_record(os.environ.pop(''REELSAGA_GOOGLE_CREDENTIALS'',''''))

        c=GoogleCredentials(Store(r),GoogleTokenForms(),SCOPES)

        a=Transport(c.access_token,{''www.googleapis.com''})

        d=checked(a(''GET'',''https://www.googleapis.com/youtube/v3/videos'',params={''part'':''snippet,status,processingDetails,fileDetails'',''id'':''8Fk60PJxIqE''})).data

        v=d[''items''][0]

        assert v[''snippet''][''channelId'']==CHANNEL and v[''snippet''][''title'']==''Cast
        Me Out, Feed the Swarm - Episode 9 Part 1/4 | NetShort''

        out={''video_id'':v[''id''],''status'':v[''status''],''processingDetails'':v.get(''processingDetails''),''fileDetails'':v.get(''fileDetails''),''read_only'':True,''no_upload_or_publish'':True}

        open(os.environ[''GITHUB_STEP_SUMMARY''],''a'').write(''## EP9P1 read-only
        processing status\n\n```json\n''+json.dumps(out,indent=2)+''\n```\n'')

        STATUS

        python status_read.py

        '
'on':
  workflow_dispatch: null
