\n    \"probe-37398641242\",\n    \"probe-37443973074\",\n    \"probe-37447067468\",\n    \"probe-37451989522\",\n    \"probe-37459655864\",\n    \"probe-37467404529\",\n    \"probe-37477624146\",\n    \"probe-37494568652\",\n    \"probe-37502302763\",\n    \"probe-37510377852\",\n    \"probe-37518223575\",\n    \"probe-37525778422\",\n    \"probe-37533224914\",\n    \"probe-37540585932\",\n    \"probe-37871458508\",\n    \"probe-37874770790\",\n    \"probe-37875084061\"\n  ]\n}\nQUARANTINE_FILE\npython -c 'from quarantine_state import QuarantineState; assert QuarantineState.__name__ == \"QuarantineState\"'\npython -m pip install boto3\ncat > tigris_staging.py <<'MODULE'\n\"\"\"ReelSaga private staging. Guarded private staging with owner-approved external-fetch risk.\"\"\"\nimport contextlib, datetime, hashlib, json, os, sqlite3, time\nimport boto3\nfrom botocore.config import Config\n\nSTORAGE_STOP = 4 * 1024**3\nWRITE_STOP, READ_STOP = 9000, 90000\n# Egress is free. This is a conservative operational ledger, not a billing cap.\nMAX_OBJECT_BYTES = 256 * 1024**2\n\nclass GuardStop(RuntimeError): pass\n\nclass Staging:\n    def __init__(self):\n        self.bucket = os.environ['TIGRIS_BUCKET']\n        if self.bucket != 'reelsaga-private-staging-71':\n            raise GuardStop('Unexpected staging bucket')\n        self.db = os.environ['TIGRIS_GUARD_DB']\n        if not os.path.exists(self.db):\n            raise GuardStop('Guard ledger missing: restore durable state, never auto-reset')\n        self.s3 = boto3.client('s3', endpoint_url='https://t3.storage.dev',region_name='auto',\n            aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],\n            aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],\n            config=Config(signature_version='s3v4',retries={'total_max_attempts':1},s3={'addressing_style':'path'}))\n\n    @contextlib.contextmanager\n    def _lock(self):\n        c=sqlite3.connect(self.db,timeout=30)\n        try:\n            c.execute('BEGIN IMMEDIATE')\n            yield c\n            c.commit()\n        except Exception:\n            c.rollback(); raise\n        finally: c.close()\n\n    def reserve(self, a=0, b=0, bytes_out=0, external_reads=0):\n        \"\"\"Commit reservations before network calls. Failed/uncertain calls keep them.\"\"\"\n        if any(type(x) is not int or x<0 for x in (a,b,bytes_out,external_reads)):\n            raise GuardStop('Invalid reservation')\n        month=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m')\n        with self._lock() as c:\n            row=c.execute('SELECT month,a,b,bytes_out,external_reads FROM budget WHERE id=1').fetchone()\n            if not row or row[0]!=month:\n                raise GuardStop('Month not reconciled: explicit audited rollover required')\n            if row[1]+a>=WRITE_STOP or row[2]+b+external_reads>=READ_STOP:\n                raise GuardStop('Monthly request stop guard')\n            c.execute('UPDATE budget SET a=a+?,b=b+?,bytes_out=bytes_out+?,external_reads=external_reads+? WHERE id=1',\n                (a,b+external_reads,bytes_out,external_reads))\n\n    def enumerate_bytes(self):\n        total=0; token=None; objects=[]\n        while True:\n            self.reserve(a=1)\n            args={'Bucket':self.bucket}\n            if token: args['ContinuationToken']=token\n            response=self.s3.list_objects_v2(**args)\n            for item in response.get('Contents',[]):\n                total+=item['Size'];objects.append({'key':item['Key'],'size':item['Size']})\n            if not response.get('IsTruncated'): return total,objects\n            token=response.get('NextContinuationToken')\n            if not token: raise GuardStop('Incomplete byte enumeration')\n\n    def stage(self,path,key,content_type,expected_sha256):\n        \"\"\"Use a single serialized uploader across workers, not just this process.\"\"\"\n        if content_type not in ('video/mp4','image/jpeg'): raise GuardStop('Unsupported content type')\n        if not key.startswith('production/') or '..' in key: raise GuardStop('Unexpected object key')\n        data=open(path,'rb').read();digest=hashlib.sha256(data).hexdigest()\n        if digest!=expected_sha256: raise GuardStop('Source manifest hash mismatch')\n        if len(data)>MAX_OBJECT_BYTES: raise GuardStop('Object too large for guarded single PUT')\n        # This lock serializes storage preflight + PUT within all users of the same local DB.\n        # Separate machines require a shared distributed lock at the pipeline layer.\n        with open(self.db+'.upload-lock','a') as lock:\n            import fcntl\n            fcntl.flock(lock,fcntl.LOCK_EX)\n            stored,_=self.enumerate_bytes()\n            if stored+len(data)>=STORAGE_STOP: raise GuardStop('4 GiB stop-before-upload')\n            self.reserve(a=1)\n            self.s3.put_object(Bucket=self.bucket,Key=key,Body=data,ContentType=content_type,\n                StorageClass='STANDARD',Metadata={'sha256':digest},IfNoneMatch='*')\n            self.reserve(b=1)\n            head=self.s3.head_object(Bucket=self.bucket,Key=key)\n            if head['ContentLength']!=len(data) or head['ContentType']!=content_type or head.get('Metadata',{}).get('sha256')!=digest:\n                raise GuardStop('HEAD verification failed; retain object, do not delete/retry')\n        return {'bucket':self.bucket,'key':key,'bytes':len(data),'sha256':digest,'content_type':content_type}\n\n    def verified_get(self,key,expected_sha256):\n        self.reserve(b=1)\n        head=self.s3.head_object(Bucket=self.bucket,Key=key)\n        self.reserve(b=1,bytes_out=head['ContentLength'])\n        data=self.s3.get_object(Bucket=self.bucket,Key=key)['Body'].read()\n        if hashlib.sha256(data).hexdigest()!=expected_sha256: raise GuardStop('GET hash mismatch')\n        return data\n\n    def signed_get(self,key):\n        \"\"\"10800-second bearer URL. Nine external reads reserved, not enforced.\"\"\"\n        if not key.startswith('production/') or '..' in key:\n            raise GuardStop('Unexpected production object key')\n        stored,_=self.enumerate_bytes()\n        if stored>=STORAGE_STOP: raise GuardStop('4 GiB staging stop')\n        self.reserve(b=1)\n        head=self.s3.head_object(Bucket=self.bucket,Key=key)\n        if head['ContentType'] not in ('video/mp4','image/jpeg'):\n            raise GuardStop('Unexpected source type')\n        # Planning allowance only. External callers can exceed it until expiry.\n        self.reserve(external_reads=9,bytes_out=9*head['ContentLength'])\n        url=self.s3.generate_presigned_url('get_object',\n            Params={'Bucket':self.bucket,'Key':key},ExpiresIn=10800)\n        from urllib.parse import urlparse,parse_qs\n        query=parse_qs(urlparse(url).query)\n        if query.get('X-Amz-Expires')!=['10800']:\n            raise GuardStop('Unexpected signed URL expiry')\n        signed_at=datetime.datetime.strptime(query['X-Amz-Date'][0],'%Y%m%dT%H%M%SZ').replace(tzinfo=datetime.timezone.utc)\n        return {'url':url,'key':key,'bytes':head['ContentLength'],\n            'content_type':head['ContentType'],'sha256':head.get('Metadata',{}).get('sha256'),\n            'expires_at':(signed_at+datetime.timedelta(seconds=10800)).isoformat(),\n            'external_reads_reserved':9,'external_reads_hard_capped':False}\n\n\n    def status(self):\n        with self._lock() as c:\n            row=c.execute('SELECT month,a,b,bytes_out,external_reads FROM budget WHERE id=1').fetchone()\n        return dict(zip(('month','class_a_reserved','class_b_reserved','bytes_out_reserved','external_reads_reserved'),row))\n\n\ndef initialize_approved_baseline(path,month,class_a,class_b):\n    \"\"\"One-time explicit baseline only. Refuses any existing DB. No auto rollover.\"\"\"\n    if os.path.exists(path): raise GuardStop('Existing ledger must not be overwritten')\n    fd=os.open(path,os.O_CREAT|os.O_EXCL|os.O_WRONLY,0o600);os.close(fd)\n    c=sqlite3.connect(path)\n    c.execute('CREATE TABLE budget(id INTEGER PRIMARY KEY CHECK(id=1),month TEXT NOT NULL,a INTEGER NOT NULL,b INTEGER NOT NULL,bytes_out INTEGER NOT NULL,external_reads INTEGER NOT NULL)')\n    c.execute('INSERT INTO budget VALUES(1,?,?,?,?,?)',(month,class_a,class_b,0,0));c.commit();c.close()\n\nMODULE\ncat > tigris_durable.py <<'MODULE'\nimport os,json,base64,sqlite3,time\nfrom tigris_staging import Staging,GuardStop,initialize_approved_baseline\nKEY='tigris-guard-202610'\nMARK='tigris-guard-initialized-202610'\ndef bootstrap(backend):\n    record,version=backend.get(KEY);mark,mv=backend.get(MARK)\n    if record:\n        if not mark:raise GuardStop('Guard marker missing')\n        return\n    if mark:raise GuardStop('Guard missing after initialization, no reset')\n    path='/tmp/tigris-bootstrap.db';initialize_approved_baseline(path,'2026-10',100,100)\n    r={'month':'2026-10','sqlite_b64':base64.b64encode(open(path,'rb').read()).decode(),'exclusive_pipeline':'reelsaga-canary','baseline':'approved conservative100/100 not provider measurement'}\n    if not backend.compare_and_swap(KEY,None,r):raise GuardStop('Bootstrap CAS conflict')\n    if not backend.compare_and_swap(MARK,None,{'initialized':True,'month':'2026-10','baseline':[100,100]}):raise GuardStop('Marker CAS conflict')\nclass DurableStaging(Staging):\n    def __init__(self,backend):\n        self.backend=backend\n        r,v=backend.get(KEY);mark,_=backend.get(MARK)\n        if not r or not mark or r['month']!='2026-10':raise GuardStop('Restore/reconcile guard required')\n        self.version=v;self.record=r\n        p=os.environ['TIGRIS_GUARD_DB'];open(p,'wb').write(base64.b64decode(r['sqlite_b64']))\n        super().__init__()\n    def reserve(self,**kw):\n        super().reserve(**kw)\n        r=dict(self.record,sqlite_b64=base64.b64encode(open(self.db,'rb').read()).decode())\n        last=None\n        for attempt in range(3):\n            if not self.backend.compare_and_swap(KEY,self.version,r):\n                saved,v=self.backend.get(KEY)\n                if saved==r:\n                    self.record=r;self.version=v;return\n                raise GuardStop('Durable reservation CAS conflict; stop before network')\n            saved,v=self.backend.get(KEY)\n            if saved==r:\n                self.record=r;self.version=v;return\n            last=GuardStop('Reservation readback unsettled; stop before network')\n            print('RETRY reserve: readback unsettled after CAS (attempt %d/3), backing off 75s'%(attempt+1),flush=True)\n            if attempt<2:time.sleep(75)\n        raise last\nMODULE\ncat > host_prep.py <<'PREPARE'\nSOURCE_URL='https://video.netshort.com/oQA0fHPoMRMsQwe5flXCgfbVXF86VFBAQFVVUm?a=0&auth_key=1792638757-6b55cac0757341e4ab5e1c8b37f6081c-0-32deaa782a17a2e5d2059517c6201451&br=1142&bt=1142&cd=0%7C0%7C0&ch=0&cr=0&cs=0&cv=1&dr=0&ds=4&eid=df30b911b6484d5d8eb70d28ef567b74&er=0&l=2026101203083830372C693517E3AEA961&lr=&mime_type=video_mp4&net=0&pl=0&qs=0&rc=M29uNHk5cmQ2ZTozMzZoNEApOjo4aDUzZTs4NzdlNGU2Z2duZl9pMmRrcjNhMi1kXjVzczFfM2M1YTRiYWE1My42LWM6Yw%3D%3D&vl=&vr='\nITEM={'id': 'netshort-flash-ep1-part1-v1', 'episode': 1, 'part': 1, 'title': 'Flash-Married to My One-Night Stand - Episode 1 Part 1/5 | NetShort', 'description': \"Pregnant by her one-night stand, Scarlett begs him to crash her wedding to a deadly villain. She thinks he's a poor racer, unaware he's a ruthless mafia godfather who secretly protects her. When a trap leads to her kidnapping at sea, he takes a bullet for her in a hail of gunfire - proving the deadliest man saved all his tenderness for her.\\n\\nThis is only one piece of the story. The rest is waiting on the channel.\\n\\nWatch on NetShort: https://r.reelsgo.tv/ac7bsvHfz9ve\\n\\nFull episode part 1 of 5.\\nAffiliate links: I may earn a commission if you use them.\", 'file': '/downloads/flash-screen/ep1-part1.mp4', 'source_start': 0.0, 'source_end': 48.375, 'privacy': 'private', 'approval_required': True, 'bytes': 57142808, 'sha256': 'a84ae6873c7305e28d7511c6eae65a7756bf90d4af37202ac2d3b672f61d46fc'}\nimport os,json,hashlib,subprocess,urllib.request\nfrom pathlib import Path\nfrom transport import Transport\nfrom quarantine_state import QuarantineState\nfrom tigris_durable import bootstrap,DurableStaging\nfrom tigris_staging import GuardStop\nb=QuarantineState(Transport(lambda:os.environ['GH_TOKEN'],{'api.github.com'}),os.environ['REELSAGA_LEDGER_KEY']);b.initialize();bootstrap(b);s=DurableStaging(b)\nkey='tigris-host-netshort-flash-ep1-part1-v1';r,v=b.get(key)\nif r:raise GuardStop('Host record exists; reconcile only')\ndata=urllib.request.urlopen(SOURCE_URL,timeout=120).read()\nif len(data)!=34865565 or hashlib.sha256(data).hexdigest()!='2bd25356e243a78fdaa18953836cce6eedd3ead10171c427888b6b554bf081d2':raise GuardStop('Supplier hash mismatch')\nPath('source.mp4').write_bytes(data)\nsubprocess.run(['docker','run','--rm','--cpuset-cpus',','.join(map(str,sorted(os.sched_getaffinity(0))[:2])),'-v',str(Path.cwd())+':/work','-w','/work','ubuntu:22.04','bash','-c',\"apt-get update -qq && apt-get install -y -qq ffmpeg >/dev/null && ffmpeg -v error -cpuflags 0 -filter_threads 1 -ss 0.0 -i source.mp4 -t 48.375 -vf 'fade=t=in:st=0:d=0.5,fade=t=out:st=47.875:d=0.5' -af 'afade=t=in:st=0:d=0.5,afade=t=out:st=47.875:d=0.5' -c:v libx264 -threads:v 3 -x264-params asm=0 -preset ultrafast -crf 18 -c:a aac -flags:a +bitexact -b:a 192k -movflags +faststart -y flash-ep1-part1.mp4 && ffmpeg -v error -i flash-ep1-part1.mp4 -f null -\"],check=True)\np=Path('flash-ep1-part1.mp4')\nprint(json.dumps({'render_bytes':p.stat().st_size,'render_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'cpu_affinity':sorted(os.sched_getaffinity(0))[:2]}),flush=True)\nif p.stat().st_size!=ITEM['bytes'] or hashlib.sha256(p.read_bytes()).hexdigest()!=ITEM['sha256']:raise GuardStop('Render parity mismatch; no PUT')\nrecords={}\nfor kind,path,ct in [('video','flash-ep1-part1.mp4','video/mp4')]:\n h=hashlib.sha256(Path(path).read_bytes()).hexdigest();obj='production/'+ITEM['id']+'/'+kind+'.'+('mp4' if kind=='video' else 'jpg')\n records[kind]=s.stage(path,obj,ct,h);s.verified_get(obj,h);records[kind].update(s.signed_get(obj))\n out={'phase':'staging','records':records,'never_publish_without_review':True}\n if not b.compare_and_swap(key,v,out):raise GuardStop('Host checkpoint CAS conflict')\n saved,v=b.get(key)\n if saved!=out:raise GuardStop('Host checkpoint unsettled')\nresult={'hosts':records,'guard':s.status(),'source_exact':True,'render_exact':True,'full_decode_clean':True,'publish_attempted':False}\nopen(os.environ['GITHUB_STEP_SUMMARY'],'a').write('## Exact FlashEP1P1 private hosts\\n\\n```json\\n'+json.dumps(result,indent=2)+'\\n```\\n')\nprint(json.dumps(result),flush=True)\n\nPREPARE\npython host_prep.py\n"
