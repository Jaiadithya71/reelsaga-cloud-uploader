name: Flash EP1P1 hostprep
permissions:
  contents: write
concurrency:
  group: reelsaga-canary
  cancel-in-progress: false
jobs:
  private-part:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: '/*.py

          /tests/

          /**/*.json

          '
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install cryptography==46.0.5
    - name: Exact Flash EP1P1 hostprep only
      env:
        GH_TOKEN: ${{ github.token }}
        REELSAGA_LEDGER_KEY: ${{ secrets.REELSAGA_LEDGER_KEY }}
        REELSAGA_IG_READ_KEY: ${{ secrets.REELSAGA_IG_READ_KEY }}
        AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
        TIGRIS_BUCKET: reelsaga-private-staging-71
        TIGRIS_GUARD_DB: /tmp/tigris-guard.db
      run: "cat > quarantine_state.py <<'QUARANTINE_FILE'\n\"\"\"Fail-closed new namespace. Original legacy records are never mutated.\"\"\"\nimport hashlib,json,re\nfrom github_state import GitHubState,StateError\nfrom adapters import checked\nFROZEN='7cf655bd667d748e2e4030da1b6b78c7aa0c236e'\nclass QuarantineState(GitHubState):\n    def __init__(self,request,key_material):\n        super().__init__(request,key_material)\n        with open('legacy_quarantine.json') as f:self.inventory=json.load(f)\n        if self.inventory['frozen_commit']!=FROZEN or len(self.inventory['legacy_keys'])!=279:\n            raise StateError('Legacy inventory mismatch')\n        self.legacy=set(self.inventory['legacy_keys'])\n    def initialize(self):\n        r=checked(self.request('GET',self.base+'/git/trees/'+FROZEN,params={'recursive':'1'})).data\n        if r.get('truncated') is not False:raise StateError('Incomplete legacy tree')\n        keys={v['path'][6:-4] for v in r['tree'] if v['path'].startswith('state/') and v['path'].endswith('.enc')}\n        if keys!=self.legacy:raise StateError('Legacy inventory integrity mismatch')\n        r=self.request('GET',self.base+'/git/ref/heads/'+self.branch)\n        if r.status!=200:raise StateError('Original state branch missing')\n    def url(self,key):\n        if not re.fullmatch(r'[a-zA-Z0-9_-]+',key):raise StateError('Invalid state key')\n        return self.base+'/contents/state-v2/'+key+'.enc'\n    def blocked(self,key):\n        if not re.fullmatch(r'[0-9a-f]{64}',key):return False\n        if key in self.legacy:return True\n        r=self.request('GET',self.base+'/contents/state/'+key+'.enc',params={'ref':self.branch})\n        if r.status==200:return True\n        if r.status!=404:raise StateError('Legacy read not verified')\n        return False\n    def get(self,key):\n        if self.blocked(key):return {'state':'blocked','legacy_quarantine':True},None\n        return super().get(key)\n    def compare_and_swap(self,key,version,record):\n        if self.blocked(key):raise StateError('Legacy key permanently quarantined')\n        return super().compare_and_swap(key,version,record)\nQUARANTINE_FILE\ncat > legacy_quarantine.json <<'QUARANTINE_FILE'\n{\n  \"frozen_commit\": \"7cf655bd667d748e2e4030da1b6b78c7aa0c236e\",\n  \"legacy_keys\": [\n    \"01fa2bc454dba1431864506e74f426111b576994d3afc951f179dcde53ee3561\",\n    \"04dbaeebf1d6adb6f666c3398a7c8852ca353793c29064a31494e4288946ce9a\",\n    \"05ff4c70645e2c565dcf5fbb53b16cd339c2cefe1846d403befc197e46600b71\",\n    \"07560d2e657a535fb59fdcdd49057e96c2c9d0017c94c7c35c8c8691c5a2755d\",\n    \"0a520c406a0ff1abeb5652d4d15129282a00f101e55391647bbd903f9dda575d\",\n    \"11b11caebbfa23b933a0a6e9f045365b526c51c92d3647ebbeb1d02a4fb87991\",\n    \"12200db9e2aefc17ed30bf283825bfdaa8233ffe21ff3ad698069502084df124\",\n    \"123f015f8bfe567382e6e08060147230df3257928c3b890fdd1291c5d990c5ad\",\n    \"12ce84ca04b09ff161add5e637bde0f71732d4c139a241aeafe4e69c9487386b\",\n    \"12e009437436f23697ff8d704e132e19b4e87bb4397669dc90ca80bdf9ae9b71\",\n    \"177002c7132a85e5fb8753f8be790840b4dba87e57ac611f90ea98924b359a1d\",\n    \"189b1907aa98b07caa27a3901005b5b1bad787c0bd7221f9089fc82d92b49738\",\n    \"1a0a6fc39a4fb41dbf52e0fdc6833a83d0050175c90507551e13d7dee7d33bab\",\n    \"1a76bc61c2406191a47eb0b363ce265e36900c81cf92d65a62b737ec83c375f5\",\n    \"1a80d4d27e9067a0ca11661ae75baf249f7ac6db4e42f7ce917f33f2c8a58e92\",\n    \"1a93d7b4ad585d3d34c97fd3c086f2c40b45ce343bc40317767965101cc1c467\",\n    \"1cd1e8f1ac7adf35156ce924358d141baa012f08e4e6e722a674fcd26e9681a0\",\n    \"1e13ab24947b737df7837124aca91aa8396097f1043b171274f9bcabbd668fcd\",\n    \"1e2bfe2cf7d1a2053c4c3133b7cfdb5447add53218c1eb29e68f8c05a4784622\",\n    \"1e930a7ec30d828445d0980aadcfc724c9da14309b4f14a60e6b8eaa36deef12\",\n    \"1e9d74901ec1b510c54eec487ea795369320abaf4ebffe522ea6119f6a472f0d\",\n    \"224e46d34ac6683b7be1b89456d7432a56bf54d716b855c4950ddcb661825623\",\n    \"25cdad8a2b12259c6fdb01c0c1