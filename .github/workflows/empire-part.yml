name: Airport EP5P1 recovery stage once
permissions:
  contents: write
concurrency:
  group: reelsaga-canary
  cancel-in-progress: false
jobs:
  private-part:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /*.py
          /tests/
          /**/*.json
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install cryptography==46.0.5
    - name: One clean EP5P1 recovery staging
      env:
        GH_TOKEN: ${{ github.token }}
        REELSAGA_LEDGER_KEY: ${{ secrets.REELSAGA_LEDGER_KEY }}
        REELSAGA_IG_READ_KEY: ${{ secrets.REELSAGA_IG_READ_KEY }}
      run: |
        cat > quarantine_state.py <<'QUARANTINE_FILE'
        """Fail-closed new namespace. Original legacy records are never mutated."""
        import hashlib,json,re
        from github_state import GitHubState,StateError
        from adapters import checked
        FROZEN='7cf655bd667d748e2e4030da1b6b78c7aa0c236e'
        class QuarantineState(GitHubState):
            def __init__(self,request,key_material):
                super().__init__(request,key_material)
                with open('legacy_quarantine.json') as f:self.inventory=json.load(f)
                if self.inventory['frozen_commit']!=FROZEN or len(self.inventory['legacy_keys'])!=279:
                    raise StateError('Legacy inventory mismatch')
                self.legacy=set(self.inventory['legacy_keys'])
            def initialize(self):
                r=checked(self.request('GET',self.base+'/git/trees/'+FROZEN,params={'recursive':'1'})).data
                if r.get('truncated') is not False:raise StateError('Incomplete legacy tree')
                keys={v['path'][6:-4] for v in r['tree'] if v['path'].startswith('state/') and v['path'].endswith('.enc')}
                if keys!=self.legacy:raise StateError('Legacy inventory integrity mismatch')
                r=self.request('GET',self.base+'/git/ref/heads/'+self.branch)
                if r.status!=200:raise StateError('Original state branch missing')
            def url(self,key):
                if not re.fullmatch(r'[a-zA-Z0-9_-]+',key):raise StateError('Invalid state key')
                return self.base+'/contents/state-v2/'+key+'.enc'
            def blocked(self,key):
                if not re.fullmatch(r'[0-9a-f]{64}',key):return False
                if key in self.legacy:return True
                r=self.request('GET',self.base+'/contents/state/'+key+'.enc',params={'ref':self.branch})
                if r.status==200:return True
                if r.status!=404:raise StateError('Legacy read not verified')
                return False
            def get(self,key):
                if self.blocked(key):return {'state':'blocked','legacy_quarantine':True},None
                return super().get(key)
            def compare_and_swap(self,key,version,record):
                if self.blocked(key):raise StateError('Legacy key permanently quarantined')
                return super().compare_and_swap(key,version,record)
        QUARANTINE_FILE
        cat > legacy_quarantine.json <<'QUARANTINE_FILE'
