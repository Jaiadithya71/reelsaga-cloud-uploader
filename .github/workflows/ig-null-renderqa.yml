name: Weakest Null E1P1 original renderer audit
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: 'sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null

        python -m pip install requests

        python null_ig_renderqa.py'
    - uses: actions/upload-artifact@v4
      with:
        name: golden-full-quality-renderqa
        path: 'p1.mp4

          render-receipt.json'
        retention-days: 1
